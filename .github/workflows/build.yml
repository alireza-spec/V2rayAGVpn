name: build-apk

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare release keystore
        # v10.1.2: when the keystore secrets exist, every release is
        # signed with the same keystore, so users update instead of
        # reinstalling. When they are absent (v10.1.2 shipped without
        # stable signing), this step sets nothing and Gradle falls back
        # to debug signing. The keystore lives only in repo secrets;
        # it is decoded here and never printed. NOTE: secrets cannot be
        # used in an `if:` condition (GitHub rejects the whole workflow
        # file at parse time), so the empty-secret check lives inside
        # the script instead.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "no keystore secret, using debug signing"; exit 0; fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/v2rayag-release.p12
          echo "KEYSTORE_FILE=$PWD/android/app/v2rayag-release.p12" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          echo "V2RAYAG_RELEASE_SIGNING=true" >> $GITHUB_ENV
      - name: Run tests
        run: flutter test
        continue-on-error: true
      - name: Build APK
        env:
          POOL_LIST: ${{ secrets.POOL_LIST }}
          POOL_URL: ${{ secrets.POOL_URL }}
          PROVIDERS_JSON: ${{ secrets.PROVIDERS_JSON }}
          PROVIDER_FAST: ${{ secrets.PROVIDER_FAST }}
          PROVIDER_UPDATE: ${{ secrets.PROVIDER_UPDATE }}
          PROVIDER_V2RAYAG: ${{ secrets.PROVIDER_V2RAYAG }}
          PROVIDER_ANTIFILTER: ${{ secrets.PROVIDER_ANTIFILTER }}
          PROVIDER_HIDDIFY: ${{ secrets.PROVIDER_HIDDIFY }}
          PROVIDER_AI: ${{ secrets.PROVIDER_AI }}
          PROVIDER_UNLIMITED: ${{ secrets.PROVIDER_UNLIMITED }}
          PSIPHON_JSON: ${{ secrets.PSIPHON_JSON }}
          UNLIMITED_CONFIGS: ${{ secrets.UNLIMITED_CONFIGS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          GONKA_API_KEY: ${{ secrets.GONKA_API_KEY }}
          GONKA_BASE_URL: ${{ secrets.GONKA_BASE_URL }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version: *//; s/+.*//')
          NUM=$(echo "$VERSION" | tr -d '.')
          LIST=$(printf '%s' "$POOL_LIST" | tr '\r\n' ',,' | sed 's/,,*/,/g;s/^,//;s/,$//')
          PROV_B64=$(printf '%s' "$PROVIDERS_JSON" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDERS_JSON" | base64)
          FAST_B64=$(printf '%s' "$PROVIDER_FAST" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_FAST" | base64)
          UPD_B64=$(printf '%s' "$PROVIDER_UPDATE" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_UPDATE" | base64)
          V2_B64=$(printf '%s' "$PROVIDER_V2RAYAG" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_V2RAYAG" | base64)
          AF_B64=$(printf '%s' "$PROVIDER_ANTIFILTER" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_ANTIFILTER" | base64)
          HID_B64=$(printf '%s' "$PROVIDER_HIDDIFY" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_HIDDIFY" | base64)
          AI_B64=$(printf '%s' "$PROVIDER_AI" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_AI" | base64)
          UNLPROV_B64=$(printf '%s' "$PROVIDER_UNLIMITED" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_UNLIMITED" | base64)
          PSI_B64=$(printf '%s' "$PSIPHON_JSON" | base64 -w0 2>/dev/null || printf '%s' "$PSIPHON_JSON" | base64)
          UNL_B64=$(printf '%s' "$UNLIMITED_CONFIGS" | base64 -w0 2>/dev/null || printf '%s' "$UNLIMITED_CONFIGS" | base64)
          AIKEY_B64=$(printf '%s' "$AI_API_KEY" | base64 -w0 2>/dev/null || printf '%s' "$AI_API_KEY" | base64)
          AIBASE_B64=$(printf '%s' "$AI_BASE_URL" | base64 -w0 2>/dev/null || printf '%s' "$AI_BASE_URL" | base64)
          GONKAKEY_B64=$(printf '%s' "$GONKA_API_KEY" | base64 -w0 2>/dev/null || printf '%s' "$GONKA_API_KEY" | base64)
          GONKABASE_B64=$(printf '%s' "$GONKA_BASE_URL" | base64 -w0 2>/dev/null || printf '%s' "$GONKA_BASE_URL" | base64)
          flutter build apk --release --split-per-abi --dart-define=POOL_LIST="$LIST" --dart-define=POOL_URL="$POOL_URL" --dart-define=PROVIDERS_B64="$PROV_B64" --dart-define=PROVIDER_FAST_B64="$FAST_B64" --dart-define=PROVIDER_UPDATE_B64="$UPD_B64" --dart-define=PROVIDER_V2RAYAG_B64="$V2_B64" --dart-define=PROVIDER_ANTIFILTER_B64="$AF_B64" --dart-define=PROVIDER_HIDDIFY_B64="$HID_B64" --dart-define=PROVIDER_AI_B64="$AI_B64" --dart-define=PROVIDER_UNLIMITED_B64="$UNLPROV_B64" --dart-define=PSIPHON_B64="$PSI_B64" --dart-define=UNLIMITED_B64="$UNL_B64" --dart-define=AI_API_KEY_B64="$AIKEY_B64" --dart-define=AI_BASE_URL_B64="$AIBASE_B64" --dart-define=GONKA_API_KEY_B64="$GONKAKEY_B64" --dart-define=GONKA_BASE_URL_B64="$GONKABASE_B64" --dart-define=BUILD_NUM="$NUM"
      - name: Collect APKs by architecture
        run: |
          mkdir -p dist
          D=build/app/outputs/flutter-apk
          cp "$D/app-arm64-v8a-release.apk" dist/V2rayAG-arm64-v8a.apk || true
          cp "$D/app-armeabi-v7a-release.apk" dist/V2rayAG-armeabi-v7a.apk || true
      - name: Build universal APK
        continue-on-error: true
        env:
          POOL_LIST: ${{ secrets.POOL_LIST }}
          POOL_URL: ${{ secrets.POOL_URL }}
          PROVIDERS_JSON: ${{ secrets.PROVIDERS_JSON }}
          PROVIDER_FAST: ${{ secrets.PROVIDER_FAST }}
          PROVIDER_UPDATE: ${{ secrets.PROVIDER_UPDATE }}
          PROVIDER_V2RAYAG: ${{ secrets.PROVIDER_V2RAYAG }}
          PROVIDER_ANTIFILTER: ${{ secrets.PROVIDER_ANTIFILTER }}
          PROVIDER_HIDDIFY: ${{ secrets.PROVIDER_HIDDIFY }}
          PROVIDER_AI: ${{ secrets.PROVIDER_AI }}
          PROVIDER_UNLIMITED: ${{ secrets.PROVIDER_UNLIMITED }}
          PSIPHON_JSON: ${{ secrets.PSIPHON_JSON }}
          UNLIMITED_CONFIGS: ${{ secrets.UNLIMITED_CONFIGS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          GONKA_API_KEY: ${{ secrets.GONKA_API_KEY }}
          GONKA_BASE_URL: ${{ secrets.GONKA_BASE_URL }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version: *//; s/+.*//')
          NUM=$(echo "$VERSION" | tr -d '.')
          LIST=$(printf '%s' "$POOL_LIST" | tr '\r\n' ',,' | sed 's/,,*/,/g;s/^,//;s/,$//')
          PROV_B64=$(printf '%s' "$PROVIDERS_JSON" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDERS_JSON" | base64)
          FAST_B64=$(printf '%s' "$PROVIDER_FAST" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_FAST" | base64)
          UPD_B64=$(printf '%s' "$PROVIDER_UPDATE" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_UPDATE" | base64)
          V2_B64=$(printf '%s' "$PROVIDER_V2RAYAG" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_V2RAYAG" | base64)
          AF_B64=$(printf '%s' "$PROVIDER_ANTIFILTER" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_ANTIFILTER" | base64)
          HID_B64=$(printf '%s' "$PROVIDER_HIDDIFY" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_HIDDIFY" | base64)
          AI_B64=$(printf '%s' "$PROVIDER_AI" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_AI" | base64)
          UNLPROV_B64=$(printf '%s' "$PROVIDER_UNLIMITED" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_UNLIMITED" | base64)
          PSI_B64=$(printf '%s' "$PSIPHON_JSON" | base64 -w0 2>/dev/null || printf '%s' "$PSIPHON_JSON" | base64)
          UNL_B64=$(printf '%s' "$UNLIMITED_CONFIGS" | base64 -w0 2>/dev/null || printf '%s' "$UNLIMITED_CONFIGS" | base64)
          AIKEY_B64=$(printf '%s' "$AI_API_KEY" | base64 -w0 2>/dev/null || printf '%s' "$AI_API_KEY" | base64)
          AIBASE_B64=$(printf '%s' "$AI_BASE_URL" | base64 -w0 2>/dev/null || printf '%s' "$AI_BASE_URL" | base64)
          GONKAKEY_B64=$(printf '%s' "$GONKA_API_KEY" | base64 -w0 2>/dev/null || printf '%s' "$GONKA_API_KEY" | base64)
          GONKABASE_B64=$(printf '%s' "$GONKA_BASE_URL" | base64 -w0 2>/dev/null || printf '%s' "$GONKA_BASE_URL" | base64)
          flutter build apk --release --dart-define=POOL_LIST="$LIST" --dart-define=POOL_URL="$POOL_URL" --dart-define=PROVIDERS_B64="$PROV_B64" --dart-define=PROVIDER_FAST_B64="$FAST_B64" --dart-define=PROVIDER_UPDATE_B64="$UPD_B64" --dart-define=PROVIDER_V2RAYAG_B64="$V2_B64" --dart-define=PROVIDER_ANTIFILTER_B64="$AF_B64" --dart-define=PROVIDER_HIDDIFY_B64="$HID_B64" --dart-define=PROVIDER_AI_B64="$AI_B64" --dart-define=PROVIDER_UNLIMITED_B64="$UNLPROV_B64" --dart-define=PSIPHON_B64="$PSI_B64" --dart-define=UNLIMITED_B64="$UNL_B64" --dart-define=AI_API_KEY_B64="$AIKEY_B64" --dart-define=AI_BASE_URL_B64="$AIBASE_B64" --dart-define=GONKA_API_KEY_B64="$GONKAKEY_B64" --dart-define=GONKA_BASE_URL_B64="$GONKABASE_B64" --dart-define=BUILD_NUM="$NUM"
          cp build/app/outputs/flutter-apk/app-release.apk dist/V2rayAG-universal.apk
      - name: List files
        run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: V2rayAG-arm64-v8a
          path: dist/V2rayAG-arm64-v8a.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: V2rayAG-armeabi-v7a
          path: dist/V2rayAG-armeabi-v7a.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: V2rayAG-universal
          path: dist/V2rayAG-universal.apk
          if-no-files-found: ignore
      - name: Publish release (plain .apk downloads, no zip)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version: *//; s/+.*//')
          gh release create "v$VERSION" dist/*.apk \
            --title "V2rayAG v$VERSION" \
            --latest \
            --notes "V2rayAG v$VERSION.

          arm64-v8a: most phones made after 2017. armeabi-v7a: older 32-bit phones. universal: works on all phones, larger file."
